name: Bump Homebrew formula

on:
  push:
    tags:
      - "v*"

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Bump Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4.2
        with:
          formula-name: ascii-flow
          homebrew-tap: iman1704/homebrew-tap
        env:
          COMMITTER_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
